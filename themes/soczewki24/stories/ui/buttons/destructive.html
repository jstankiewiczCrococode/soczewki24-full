<p><strong>Wagi (regular)</strong></p>
<div class="d-flex flex-wrap gap-2 align-items-center mb-4">
  <button type="button" class="btn btn-primary">Primary</button>
  <button type="button" class="btn btn-secondary">Secondary</button>
  <button type="button" class="btn btn-tertiary">Tertiary</button>
</div>

<p><strong>Wagi (destructive)</strong></p>
<div class="d-flex flex-wrap gap-2 align-items-center mb-4">
  <button type="button" class="btn btn-primary btn-destructive">Primary destructive</button>
  <button type="button" class="btn btn-secondary btn-destructive">Secondary destructive</button>
  <button type="button" class="btn btn-tertiary btn-destructive">Tertiary destructive</button>
</div>

<p><strong>Rozmiary (na przykladzie primary)</strong></p>
<div class="d-flex flex-wrap gap-2 align-items-center mb-4">
  <button type="button" class="btn btn-primary btn-xs">XS</button>
  <button type="button" class="btn btn-primary btn-sm">SM</button>
  <button type="button" class="btn btn-primary btn-md">MD</button>
  <button type="button" class="btn btn-primary">Domyslny (= MD)</button>
</div>

<p><strong>Stan disabled</strong></p>
<div class="d-flex flex-wrap gap-2 align-items-center">
  <button type="button" class="btn btn-primary" disabled>Primary</button>
  <button type="button" class="btn btn-secondary" disabled>Secondary</button>
  <button type="button" class="btn btn-tertiary" disabled>Tertiary</button>
  <button type="button" class="btn btn-primary btn-destructive" disabled>Destructive</button>
</div>
