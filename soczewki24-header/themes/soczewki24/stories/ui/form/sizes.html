<p class="fw-bold mb-3">Inputs</p>

<div class="row g-4">
  <div class="col-4">
    <p class="fw-bold mb-3">MD</p>

    <div class="mb-3">
      <label class="form-label" for="size-md-default">Label</label>
      <input type="text" class="form-control" id="size-md-default" placeholder="Text Field" />
      <small class="form-text">Helping text</small>
    </div>

    <div class="mb-3">
      <label class="form-label" for="size-md-filled">Label</label>
      <input type="text" class="form-control" id="size-md-filled" value="Text Field" />
      <small class="form-text">Helping text</small>
    </div>

    <div class="mb-3">
      <label class="form-label" for="size-md-disabled">Label</label>
      <input type="text" class="form-control" id="size-md-disabled" placeholder="Text Field" disabled />
      <small class="form-text">Helping text</small>
    </div>

    <div class="mb-3">
      <label class="form-label" for="size-md-error">Label</label>
      <input type="text" class="form-control is-invalid" id="size-md-error" placeholder="Text Field" />
      <small class="form-text text-danger">Helping text</small>
    </div>
  </div>

  <div class="col-4">
    <p class="fw-bold mb-3">SM</p>

    <div class="mb-3">
      <label class="form-label" for="size-sm-default">Label</label>
      <input type="text" class="form-control form-control-sm" id="size-sm-default" placeholder="Text Field" />
      <small class="form-text">Helping text</small>
    </div>

    <div class="mb-3">
      <label class="form-label" for="size-sm-filled">Label</label>
      <input type="text" class="form-control form-control-sm" id="size-sm-filled" value="Text Field" />
      <small class="form-text">Helping text</small>
    </div>

    <div class="mb-3">
      <label class="form-label" for="size-sm-disabled">Label</label>
      <input type="text" class="form-control form-control-sm" id="size-sm-disabled" placeholder="Text Field" disabled />
      <small class="form-text">Helping text</small>
    </div>

    <div class="mb-3">
      <label class="form-label" for="size-sm-error">Label</label>
      <input type="text" class="form-control form-control-sm is-invalid" id="size-sm-error" placeholder="Text Field" />
      <small class="form-text text-danger">Helping text</small>
    </div>
  </div>

  <div class="col-4">
    <p class="fw-bold mb-3">XS</p>

    <div class="mb-3">
      <label class="form-label" for="size-xs-default">Label</label>
      <input type="text" class="form-control form-control-xs" id="size-xs-default" placeholder="Text Field" />
      <small class="form-text">Helping text</small>
    </div>

    <div class="mb-3">
      <label class="form-label" for="size-xs-filled">Label</label>
      <input type="text" class="form-control form-control-xs" id="size-xs-filled" value="Text Field" />
      <small class="form-text">Helping text</small>
    </div>

    <div class="mb-3">
      <label class="form-label" for="size-xs-disabled">Label</label>
      <input type="text" class="form-control form-control-xs" id="size-xs-disabled" placeholder="Text Field" disabled />
      <small class="form-text">Helping text</small>
    </div>

    <div class="mb-3">
      <label class="form-label" for="size-xs-error">Label</label>
      <input type="text" class="form-control form-control-xs is-invalid" id="size-xs-error" placeholder="Text Field" />
      <small class="form-text text-danger">Helping text</small>
    </div>
  </div>
</div>

<hr class="my-4" />

<p class="fw-bold mb-3">Text box (textarea)</p>

<div class="row g-4">
  <div class="col-4">
    <div class="mb-3">
      <label class="form-label" for="textbox-default">Label</label>
      <textarea class="form-control" id="textbox-default" rows="4" placeholder="Text Field"></textarea>
      <small class="form-text">Helping text</small>
    </div>
  </div>
</div>
